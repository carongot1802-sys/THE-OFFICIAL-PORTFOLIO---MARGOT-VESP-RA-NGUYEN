<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Nguyễn Thị Minh Ngọc — Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EA;--cr:#EDE5D6;--ma:#A8B58A;--sa:#C6CEB5;--fo:#354735;--wa:#795744;--tx:#332A25;--mu:#6f6253;--ln:#d9cfbd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d211c;--cr:#272c25;--fo:#C6CEB5;--tx:#efe8da;--mu:#b7a796;--ln:#3a4037;--wa:#d1a98f;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 Montserrat,system-ui,sans-serif;overflow-x:hidden}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
a{color:inherit}:focus-visible{outline:2px solid var(--fo);outline-offset:3px}
.w{max-width:1120px;margin:auto;padding:0 24px}section{padding:84px 0;border-top:1px solid var(--ln)}
.eb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--wa);font-weight:500}
h1,h2,h3{color:var(--fo);font-weight:500;line-height:1.2;margin:.3em 0}h1{font-size:clamp(34px,6vw,64px);font-weight:300}h2{font-size:clamp(26px,4vw,40px);font-weight:300}h3{font-size:19px}
nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
nav .w{display:flex;align-items:center;gap:18px;height:56px}nav a{text-decoration:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.lk{display:flex;gap:18px;margin-left:auto}.lk a.on{color:var(--fo);border-bottom:2px solid var(--ma);font-weight:600}
.lg button,.bt{font:inherit;cursor:pointer}.lg button{background:none;border:0;font-size:12px;padding:6px 4px;color:var(--mu)}.lg button[aria-pressed=true]{color:var(--fo);font-weight:600;text-decoration:underline}
#mb{display:none;background:none;border:1px solid var(--ln);padding:6px 10px;color:var(--fo)}
.bt{display:inline-block;padding:13px 24px;border:1px solid var(--fo);background:var(--fo);color:var(--bg);text-decoration:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:6px 10px 6px 0;transition:.2s}.bt.s{background:none;color:var(--fo)}.bt:hover{background:var(--wa);border-color:var(--wa);color:#fff}
.hero{display:grid;grid-template-columns:1.3fr .8fr;gap:56px;align-items:center;padding:70px 0}.hero p{max-width:560px;color:var(--mu)}
.pf{position:relative}.pf img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.pf:before{content:"";position:absolute;inset:14px -14px -14px 14px;border:1px solid var(--ma);z-index:-1}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--cr);border:1px dashed var(--ma);color:var(--mu);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:14px;min-height:140px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:40px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:var(--cr);padding:22px;border-top:3px solid var(--sa)}.card.aw{border-top-color:var(--wa)}
.fp{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;padding:36px 0;border-top:1px solid var(--ln)}.fp:nth-child(even) .fm{order:2}
.fm img{width:100%;display:block}.tag{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ma);color:var(--fo);padding:3px 10px;margin:0 6px 8px 0}.tag.pr{background:var(--wa);color:#fff;border-color:var(--wa)}
.av{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:14px 0;padding:0;list-style:none}.av li{background:var(--sa);color:#1f2a1f;padding:8px 4px;font-size:11px;text-align:center}.av b{display:block;font-size:20px}
details{border-top:1px solid var(--ln);padding:18px 0}summary{cursor:pointer;list-style:none;display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}summary::-webkit-details-marker{display:none}
summary h3{margin:0;flex:1 1 280px}summary small{color:var(--mu);font-size:12px}summary:after{content:"+";color:var(--wa);font-size:22px}details[open] summary:after{content:"–"}
details ul{padding-left:18px}details li{margin:5px 0;color:var(--tx)}.lnk{display:inline-block;font-size:12px;margin:4px 14px 4px 0;color:var(--fo);font-weight:500}
.vid{aspect-ratio:16/9;width:100%;background:var(--cr);position:relative}.vid video{width:100%;height:100%;display:block;background:#000}.vid .ph{height:100%;border:1px dashed var(--wa)}
.ar{display:block;text-decoration:none;padding:18px 0;border-top:1px solid var(--ln)}.ar:hover h3{color:var(--wa)}.ar h3{margin:4px 0;font-size:16px;font-weight:500}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gl img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.sk h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase}.sk ul{padding-left:16px;color:var(--mu);font-size:14px}
footer{background:var(--fo);color:#F7F3EA;padding:40px 0;font-size:13px}footer a{color:#F7F3EA}
@media(max-width:820px){.hero,.g2,.fp{grid-template-columns:1fr}.fp:nth-child(even) .fm{order:0}.pf{max-width:320px}#mb{display:block}.lk{display:none;position:absolute;top:56px;left:0;right:0;background:var(--bg);flex-direction:column;padding:16px 24px;border-bottom:1px solid var(--ln)}.lk.o{display:flex}.lg{margin-left:auto}nav .w{position:relative}.av{grid-template-columns:repeat(3,1fr)}section{padding:56px 0}}
</style></head><body>

<main id="app"></main>

sub:["Tôi khám phá giao điểm của báo chí, truyền thông văn hóa và kể chuyện liên văn hóa — biến nghiên cứu, trải nghiệm và những chi tiết văn hóa thành câu chuyện chạm đến mọi người.","I explore the intersections of journalism, cultural communication, and intercultural storytelling — turning research, lived experiences, and cultural details into stories that resonate with people.","J’explore les croisements entre journalisme, communication culturelle et récit interculturel : je transforme recherches, vécus et détails culturels en histoires qui touchent."],
c1:["Khám phá công việc","Explore my work","Découvrir mon travail"],c2:["Liên hệ","Get in touch","Me contacter"],
ab:[["Tôi quan tâm đến truyền thông và báo chí như những cách kể chuyện, kết nối con người và khám phá chiều sâu của văn hóa. Qua các dự án và trải nghiệm thực tiễn, tôi đặc biệt hướng sự chú ý đến văn hóa Việt Nam, Pháp và cộng đồng Pháp ngữ, cũng như cách những giá trị văn hóa được gìn giữ, diễn giải và lan tỏa trong đời sống đương đại.","Tôi mong muốn trở thành một người làm báo và truyền thông văn hóa, kể những câu chuyện có ý nghĩa bằng sự tò mò, tư duy phản biện và khả năng sáng tạo; từ những con người, di sản và lát cắt đời sống gần gũi, góp phần đưa văn hóa đến gần hơn với công chúng."],
["I see journalism and communication as ways to tell stories, connect people, and explore the depth of culture. Through my projects and practical experience, I am particularly interested in Vietnamese and French cultures, the Francophone world, and the ways cultural values are preserved, interpreted, and shared in contemporary life.","I aspire to work in journalism and cultural communication, telling meaningful stories through curiosity, critical thinking, and creativity. By exploring people, heritage, and everyday experiences, I hope to make culture more accessible and relevant to wider audiences."],
["Je m’intéresse au journalisme et à la communication comme des moyens de raconter des histoires, de rapprocher les individus et d’explorer la richesse des cultures. À travers mes projets et mes expériences de terrain, je porte une attention particulière aux cultures vietnamienne et française, au monde francophone et aux façons dont les valeurs culturelles sont préservées, interprétées et transmises dans la société contemporaine.","Je souhaite évoluer dans le journalisme et la communication culturelle, en racontant des histoires porteuses de sens grâce à la curiosité, à l’esprit critique et à la créativité. En explorant les parcours individuels, le patrimoine et les scènes de la vie quotidienne, j’espère rendre la culture plus accessible et plus proche du public."]],

a:{t:"La jeunesse est l’avenir",y:2026,u:"https://lecourrier.vn/la-jeunesse-est-lavenir/1357370.html",img:"jeu",aw:0,cat:["Kể chuyện video Pháp ngữ","Francophone video storytelling","Récit vidéo francophone"],
d:["Lấy cảm hứng từ câu nói của Hồ Chí Minh “La jeunesse est le printemps de la société”, video khám phá mối quan hệ giữa thanh niên và hòa bình: người trẻ không trực tiếp tạo ra hòa bình nhưng có thể đặt nền móng cho nó bằng những hành động thường ngày. Phim đi từ hình ảnh lịch sử về Hồ Chí Minh, nước Pháp, chiến tranh và độc lập đến những người trẻ hôm nay, và dùng khung AVENIR để nối chủ đề trừu tượng với con người thật, trong đó có một nhân viên quán cà phê khiếm thính dùng ngôn ngữ ký hiệu.","Inspired by Hồ Chí Minh’s phrase “La jeunesse est le printemps de la société”, the video explores youth and peace: young people may not create peace directly, but they can lay its foundations through everyday actions. The film moves from historical imagery of Hồ Chí Minh, France, war and independence to today’s youth, and uses the AVENIR framework to tie an abstract theme to real people, including a Deaf café worker who uses sign language.","Inspirée de la phrase de Hồ Chí Minh « La jeunesse est le printemps de la société », la vidéo explore le lien entre jeunesse et paix : les jeunes ne créent pas la paix directement, mais peuvent en poser les fondations par des gestes quotidiens. Le film passe d’images historiques (Hồ Chí Minh, France, guerre, indépendance) à la jeunesse d’aujourd’hui, et utilise le cadre AVENIR pour relier un thème abstrait à des personnes réelles, dont une employée de café sourde utilisant la langue des signes."]},
